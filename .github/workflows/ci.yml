name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: HTTP, interface, offline and update regressions
        run: npm run test:integration
      - run: npm run build:static
  android:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" deixou de estar disponível no SDK.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePreview
        working-directory: android
      - run: node scripts/check-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk --debug
      - run: node scripts/check-apk.mjs android/app/build/outputs/apk/preview/app-preview.apk --preview
      - uses: actions/upload-artifact@v4
        with:
          name: tutor-ia-teste
          path: android/app/build/outputs/apk/preview/app-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tutor-ia-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Keystore and committed storage regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
